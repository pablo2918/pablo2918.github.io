<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Volta als Tres Castells</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@700;800&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mapa topográfico a la izquierda (con perfil debajo), cuaderno de ruta a la derecha; en móvil se apilan. */
:root{
  --ground:#ECEFE7; --panel:#F7F8F4; --ink:#1C231E; --muted:#5B665D; --line:#D3D8CC;
  --contour:#B9946A; --contour-index:#8F6A42; --road:#8A8F86; --track:#8A6B4C;
  --route:#C4232C; --route-case:#FFFFFF; --accent:#C4232C;
  --castle:#C4232C; --church:#6A4D9E; --view:#25699A; --nature:#3B7A35; --village:#2B332D;
  --hill-op:.5; --chip:#E3E7DD;
  --f-display:"Alegreya SC", "Alegreya", Georgia, serif;
  --f-story:"Alegreya", Georgia, "Times New Roman", serif;
  --f-ui:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131915; --panel:#1A211C; --ink:#E4E9E1; --muted:#99A498; --line:#2C362F;
    --contour:#6A5236; --contour-index:#94744B; --road:#6E766D; --track:#866A4C;
    --route:#FF5048; --route-case:#131915; --accent:#FF6A5E;
    --castle:#FF6A5E; --church:#B69BEE; --view:#72B4E6; --nature:#7CC46E; --village:#E4E9E1;
    --hill-op:.85; --chip:#252E28; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#131915; --panel:#1A211C; --ink:#E4E9E1; --muted:#99A498; --line:#2C362F;
  --contour:#6A5236; --contour-index:#94744B; --road:#6E766D; --track:#866A4C;
  --route:#FF5048; --route-case:#131915; --accent:#FF6A5E;
  --castle:#FF6A5E; --church:#B69BEE; --view:#72B4E6; --nature:#7CC46E; --village:#E4E9E1;
  --hill-op:.85; --chip:#252E28; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,430px);grid-template-rows:auto minmax(0,1fr) auto;gap:12px 20px;padding-inline:16px;padding-block:14px}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.brand{min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.4vw,40px);line-height:1;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
h1 .sep{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-weight:500;font-size:17px}
.stats span{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.mapwrap{position:relative;min-height:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--ground)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.hill{opacity:var(--hill-op)}
.contour{fill:none;stroke:var(--contour);stroke-width:.6;opacity:.75}
.contour.idx{stroke:var(--contour-index);stroke-width:1.1;opacity:.9}
.way{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.way.r{stroke:var(--road);stroke-width:2.6}
.way.u{stroke:var(--road);stroke-width:1.8}
.way.s{stroke:var(--road);stroke-width:1.3}
.way.t{stroke:var(--track);stroke-width:1.3;stroke-dasharray:5 3}
.way.p{stroke:var(--track);stroke-width:1.2;stroke-dasharray:1.5 3}
.route-case{fill:none;stroke:var(--route-case);stroke-width:8;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.route{fill:none;stroke:var(--route);stroke-width:3.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.route-hi{fill:none;stroke:var(--route);stroke-width:7;vector-effect:non-scaling-stroke;opacity:.28;stroke-linecap:round}
.miravet-link{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.arrow{fill:var(--route);stroke:var(--route-case);stroke-width:1}
.kmlab{font-family:var(--f-data);font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--ground);stroke-width:3px;font-variant-numeric:tabular-nums}
.kmdot{fill:var(--route-case);stroke:var(--route);stroke-width:1.5}
.place{font-family:var(--f-story);font-style:italic;font-size:13px;fill:var(--muted);paint-order:stroke;stroke:var(--ground);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.place.big{font-size:15px;fill:var(--ink)}
.poi{cursor:pointer;outline:none}
.poi circle.bg{stroke:var(--route-case);stroke-width:2.2}
.poi text{font-family:var(--f-data);font-size:11px;font-weight:500;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.poi .ring{fill:none;stroke:var(--ink);stroke-width:2;opacity:0}
.poi.on .ring{opacity:1}
.poi:hover circle.bg,.poi:focus-visible circle.bg{stroke:var(--ink)}
.poi .lab{font-family:var(--f-ui);font-size:12.5px;font-weight:700;fill:var(--ink);text-anchor:start;paint-order:stroke;stroke:var(--ground);stroke-width:3.5px;stroke-linejoin:round}
.poi.extra circle.bg{stroke-dasharray:3 2}
.cursor{fill:var(--route-case);stroke:var(--ink);stroke-width:2.5}
.me-acc{fill:#1A73E8;fill-opacity:.14;stroke:#1A73E8;stroke-opacity:.4;stroke-width:1}
.me-dot{fill:#1A73E8;stroke:#fff;stroke-width:3}
.me-pulse{fill:none;stroke:#1A73E8;stroke-width:2;animation:mepulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mepulse{from{transform:scale(1);opacity:.8}to{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.me-pulse{animation:none;opacity:0}}
.me-stale .me-dot{fill:#8A8F86}
.p-me{fill:#1A73E8;stroke:#fff;stroke-width:2}
.mapctl button#zme{color:var(--ink)}
.mapctl button#zme.on{color:#fff;background:#1A73E8;border-color:#1A73E8}
.mapctl button#zme.wait svg{animation:mespin 1.2s linear infinite}
@keyframes mespin{to{transform:rotate(360deg)}}
.mestatus{position:absolute;left:50%;transform:translateX(-50%);top:10px;max-width:calc(100% - 150px);font-family:var(--f-data);font-size:11.5px;color:var(--ink);background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:4px 8px;text-align:center;font-variant-numeric:tabular-nums}

.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center}
.mapctl button.wide{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;display:grid;grid-template-columns:auto auto;gap:3px 14px;max-width:calc(100% - 20px)}
.legend div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend svg{flex:none}
.scalebar{position:absolute;left:10px;top:10px;font-family:var(--f-data);font-size:10.5px;color:var(--ink);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:3px 6px;border-radius:4px}
.scalebar i{display:block;height:5px;border:1.5px solid var(--ink);border-top:none;margin-top:2px}

.profile{min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 10px 4px;position:relative}
.profile-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.readout{font-family:var(--f-data);text-transform:none;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
#prof{display:block;width:100%;height:120px;touch-action:none}
.p-area{fill:var(--route);opacity:.14}
.p-line{fill:none;stroke:var(--route);stroke-width:1.8}
.p-grid{stroke:var(--line);stroke-width:1}
.p-tick{font-family:var(--f-data);font-size:10px;fill:var(--muted);font-variant-numeric:tabular-nums}
.p-poi{cursor:pointer}
.p-poi line{stroke:var(--ink);stroke-width:1;opacity:.35;stroke-dasharray:2 2}
.p-poi circle{stroke:var(--panel);stroke-width:1.5}
.p-poi text{font-family:var(--f-data);font-size:9px;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.p-cur{stroke:var(--ink);stroke-width:1}

aside{grid-row:2/4;grid-column:2;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;scroll-behavior:smooth}
.story{padding:22px 24px 28px;display:flex;flex-direction:column;gap:14px}
.kick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.kick .chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;background:var(--chip);color:var(--ink);letter-spacing:.08em}
.kick .chip i{width:9px;height:9px;border-radius:50%;display:block}
.kick .num{font-family:var(--f-data);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.story h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.story .sub{font-family:var(--f-story);font-style:italic;color:var(--muted);font-size:17px;margin:-6px 0 0}
.story p{font-family:var(--f-story);font-size:17px;line-height:1.55;margin:0;max-width:62ch}
.story p.lead{font-size:19px}
.story h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 -4px;font-weight:700}
.tell{background:var(--chip);border-radius:6px;padding:14px 16px 15px;display:flex;flex-direction:column;gap:6px;position:relative}
.tell span{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.tell p{font-size:18px;line-height:1.45;font-style:italic}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.facts li{font-family:var(--f-story);font-size:16px;line-height:1.5;padding-left:22px;position:relative}
.facts li::before{content:"";position:absolute;left:3px;top:.62em;width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--accent)}
.nature{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.nature h3{color:var(--nature);margin:0}
.nature p{font-size:16px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px;border-top:1px solid var(--line);padding-top:14px}
.nav button{border:1px solid var(--line);background:var(--ground);border-radius:6px;padding:8px 12px;cursor:pointer;text-align:left;min-width:0;flex:1}
.nav button:last-child{text-align:right}
.nav button small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nav button span{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button[disabled]{visibility:hidden}
.osm{font-size:13px;color:var(--muted)}
.osm a{color:inherit}

.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stops li button{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;border:none;background:none;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.stops li button:hover{background:var(--chip)}
.stops .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-data);font-size:12px;color:#fff;font-weight:500}
.stops .t{font-weight:700;font-size:15px;line-height:1.2}
.stops .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.stops .k{font-family:var(--f-data);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;line-height:1.45}
.btn-start{align-self:flex-start;border:none;background:var(--accent);color:var(--route-case);font-weight:700;padding:10px 16px;border-radius:6px;cursor:pointer}
:root:not([data-theme="dark"]) .btn-start{color:#fff}

@media (max-width:860px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .mapwrap{height:62vh;min-height:360px}
  aside{overflow:visible}
  .story{padding:18px 16px 24px}
  .story h2{font-size:26px}
  .legend{grid-template-columns:auto auto;font-size:11px}
}
@media (prefers-reduced-motion: reduce){aside{scroll-behavior:auto}}
</style>

<div class="app">
  <header>
    <div class="brand">
      <div class="eyebrow">Ruta corta · Castell de Mur · Pallars Jussà</div>
      <h1>La Volta als Tres Castells</h1>
    </div>
    <div class="stats">
      <div><b>8 km</b><span>oficiales</span></div>
      <div><b>+400 m</b><span>desnivel</span></div>
      <div><b>sáb 10 oct</b><span>salida 10:00</span></div>
      <div><b>Plaça Major</b><span>Guàrdia de Noguera</span></div>
    </div>
  </header>

  <div class="mapwrap">
    <svg id="map" role="img" aria-label="Mapa topográfico de la ruta"></svg>
    <div class="scalebar" id="scalebar"><span id="scaletxt">500 m</span><i id="scaleline" style="width:60px"></i></div>
    <div class="mapctl">
      <button id="zin" aria-label="Acercar">+</button>
      <button id="zout" aria-label="Alejar">−</button>
      <button id="zfit" class="wide" aria-label="Ver toda la ruta">Ruta</button>
      <button id="zme" aria-label="Mostrar mi ubicación"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
    </div>
    <div class="mestatus" id="mestatus" role="status" aria-live="polite" hidden></div>
    <div class="legend" aria-label="Leyenda">
      <div><svg width="22" height="8"><line x1="1" y1="4" x2="21" y2="4" stroke="var(--route)" stroke-width="3.5" stroke-linecap="round"/></svg>Itinerario</div>
      <div><svg width="10" height="10"><circle cx="5" cy="5" r="4.5" fill="var(--castle)"/></svg>Castillo</div>
      <div><svg width="22" height="8"><line x1="1" y1="4" x2="21" y2="4" stroke="var(--track)" stroke-width="1.5" stroke-dasharray="5 3"/></svg>Pista</div>
      <div><svg width="10" height="10"><circle cx="5" cy="5" r="4.5" fill="var(--church)"/></svg>Iglesia</div>
      <div><svg width="22" height="8"><line x1="1" y1="4" x2="21" y2="4" stroke="var(--track)" stroke-width="1.5" stroke-dasharray="1.5 3" stroke-linecap="round"/></svg>Sendero</div>
      <div><svg width="10" height="10"><circle cx="5" cy="5" r="4.5" fill="var(--view)"/></svg>Mirador</div>
      <div><svg width="22" height="8"><line x1="1" y1="4" x2="21" y2="4" stroke="var(--road)" stroke-width="2.5"/></svg>Carretera</div>
      <div><svg width="10" height="10"><circle cx="5" cy="5" r="4.5" fill="var(--nature)"/></svg>Naturaleza</div>
    </div>
  </div>

  <div class="profile">
    <div class="profile-head"><span>Perfil de altitud</span><span class="readout" id="readout">Pasa el dedo por el perfil</span></div>
    <svg id="prof" aria-label="Perfil de altitud de la ruta"></svg>
  </div>

  <aside id="panel" aria-live="polite"><div class="story" id="story"></div></aside>
</div>

{ id:1, type:"village", at:[42.0925,0.8775], km:0, alt:520,
  name:"Plaça Major de Guàrdia de Noguera", sub:"Salida · el pueblo que bajó de la montaña",
  lead:"Mira a tu alrededor: esta plaza es el resultado de una mudanza. Durante siglos los vecinos de Guàrdia vivieron allá arriba, pegados al castillo y vigilando la frontera. Un buen día se cansaron de subir cuestas con el cántaro y se bajaron al llano.",
  body:[
    "Y no se mudaron de cualquier manera. Guàrdia se trazó casi con escuadra y cartabón: calles en cuadrícula, una Carrer Major que lo atraviesa todo, muralla y portales. Era una <em>vila closa</em>, un pueblo cerrado, con permiso para celebrar mercado y feria. Medieval, sí, pero con plan urbanístico.",
    "El nombre lo dice todo. <em>Guàrdia</em> es una palabra de origen germánico que significa puesto de vigilancia, así que el pueblo se llama, literalmente, «la Garita». Durante siglos fue Guàrdia de Tremp; hoy lleva el apellido del río, la Noguera.",
    "Entre 1550 y 1750 vivió su época dorada, y las familias con posibles se hicieron casas con escudo en la puerta. Antes de arrancar, date una vuelta por la Carrer Major: hay dinteles con escudos fechados en 1570 y en 1609. Llevan más de 400 años ahí, aguantando la casa."
  ],
  tell:"En 1860 vivían aquí 738 personas; hoy, unas 90. La primera edición de la Volta reunió a un centenar de caminantes, así que es muy posible que esta mañana haya en la plaza más gente con mochila que vecinos.",
  facts:[
    "En 1845 el geógrafo Pascual Madoz pasó por aquí y apuntó lo que había: un molino de harina, un molino de aceite y una destilería. Pan, aceite y aguardiente: lo básico, resuelto.",
    "Contra las tormentas no había pararrayos que valiera: se ponían dos hoces en cruz y se tocaban las campanas a todo trapo.",
    "En Semana Santa se hacía la Procesión del Silencio: todo el pueblo por las calles, sin decir palabra y con todas las luces apagadas. Debía de poner los pelos de punta.",
    "La iglesia barroca de Santa Maria está ligada a la Mare de Déu del Remei, cuya fiesta caía tradicionalmente el segundo domingo de octubre. O sea, mañana.",
    "Guàrdia es la capital de un municipio que se llama como un castillo, Castell de Mur. Nació en 1972 al juntar Guàrdia de Tremp y Mur."
  ]
},
{ id:2, type:"church", at:[42.10148,0.87514], km:2089, alt:718,
  name:"Sant Feliu de Guàrdia", sub:"La iglesia que se quedó sola en el monte",
  lead:"Llevas dos kilómetros de subida y mereces saber por qué: estás llegando al Guàrdia original. Aquí arriba estaba el pueblo antes de la mudanza, y esta era su parroquia.",
  body:[
    "Sant Feliu es del siglo XI, cuando el románico era lo último. Tiene una sola nave, cubierta con una bóveda de cañón y dos arcos de refuerzo. Sencilla y robusta, hecha para durar mil años. Casi lo ha conseguido.",
    "Fíjate en el ábside, la parte redondeada: tiene una hilera de arquitos ciegos y franjas verticales. Es la firma del <em>románico lombardo</em>. La traían cuadrillas de canteros del norte de Italia que iban de obra en obra por media Europa, algo así como una franquicia medieval: las mismas soluciones en Lombardía que en el Pallars.",
    "Cuando el pueblo bajó al llano, Sant Feliu se quedó sin feligreses. En 1904 ya ni siquiera figuraba en la lista de capillas. Perdió el tejado y parte de los muros, pero ha tenido una segunda oportunidad: la organización de la Volta destaca que la ermita se ha rehabilitado recientemente."
  ],
  tell:"Cuando Colón llegó a América, esta iglesia ya llevaba aquí unos 400 años.",
  facts:[
    "En el siglo XI dependía de la <em>pabordia</em> de Mur, la oficina que administraba las rentas de los canónigos. Hasta la fe llevaba su contabilidad.",
    "Estás a unos 718 m, casi 200 metros por encima de la plaza. Tus piernas ya lo saben.",
    "Es Bien Cultural de Interés Local desde 2007."
  ]
},
{ id:3, type:"castle", at:[42.10117,0.8766], km:2234, alt:705,
  name:"Castell de Guàrdia", sub:"Primer castillo · una torre con forma de proa",
  lead:"Año 1000. Al otro lado del Montsec empieza al-Ándalus. Si llegan jinetes desde el sur, alguien tiene que verlos antes que nadie. Ese alguien estaba aquí.",
  body:[
    "Los condes de Pallars y de Urgell fueron ganando terreno hacia el sur con una red de castillos que se veían unos a otros, como una cadena de vigías. Guàrdia tenía un trabajo muy concreto: ser los ojos del castillo de Mur sobre el Congost de Terradets, el corte por donde el río atraviesa la sierra.",
    "Mira la torre. No es cuadrada ni redonda: es un triángulo con la punta redondeada, como la proa de un barco. Mide unos 8 m y tiene dos puertas, una a ras de suelo y otra en el primer piso. Arriba aún asoman restos de las almenas. Por su forma, los expertos creen que podría ser más antigua que el resto del castillo, de hacia el año 1000.",
    "Del recinto queda el muro de levante: 24 m de largo, 3 de alto y cinco aspilleras, las rendijas para disparar, apuntando a la Conca de Tremp."
  ],
  tell:"Este castillo ya sale en un documento del año 958. Es decir, siglo y medio antes de que la palabra «Cataluña» apareciera escrita por primera vez.",
  facts:[
    "En 958 el conde Ramon III de Pallars se lo dio en feudo a un tal Berenguer, pero se quedó un tercio de los derechos. Eso es el feudalismo: te lo dejo, pero no del todo.",
    "En 1072 Arnau Mir de Tost, el gran señor de la frontera, se lo dejó en herencia a su hija Valença y a su nieto. Apúntate el nombre, porque en Mur te lo vuelves a encontrar.",
    "En 1381 se vendió a Berenguer d'Abella, hombre de confianza de la corte de Barcelona. Siguió siendo de la Corona hasta el siglo XIX.",
    "Es Bien Cultural de Interés Nacional, la máxima protección patrimonial de Cataluña."
  ]
},
{ id:4, type:"view", at:[42.10251,0.86965], km:2900, alt:774,
  name:"Mirador de la Conca de Tremp", sub:"Ahí abajo paseaban dinosaurios",
  lead:"Esas tierras rojizas del fondo no son solo bonitas. Son un álbum de fotos de hace 70 millones de años, y en las últimas páginas salen los últimos dinosaurios de Europa.",
  body:[
    "Al final del Cretácico esto era una llanura costera con ríos, lagunas y mucho barro. Los dinosaurios venían a poner huevos y dejaban huellas al pasar. Ese barro se convirtió en las arcillas y areniscas de la Formación Tremp, que han dado nidos, huevos, rastros y huesos de hadrosaurios, los «pico de pato», y de titanosaurios, aquellos gigantes de cuello largo.",
    "Lo especial es que las capas llegan casi hasta el final de la historia, hasta poco antes del gran asteroide. Pocos sitios del mundo enseñan tan bien cómo vivían los dinosaurios en sus últimos tiempos. Si te quedas con ganas, en Isona está el Museu de la Conca Dellà, a un rato en coche.",
    "Al norte asoma el Pirineo; al sur, la muralla recta del Montsec. La conca quedó encajonada entre los dos cuando el choque de placas levantó las montañas."
  ],
  tell:"Los hadrosaurios tenían cientos de dientes que se iban reponiendo a medida que se gastaban. Masticaban plantas duras todo el día y nunca necesitaban dentista.",
  facts:[
    "¿Te has fijado? Guàrdia, Collmorter y Mur están casi a la misma altura sobre esta cresta. No es casualidad: desde aquí arriba se ve todo el valle, y quien lo ve todo, manda.",
    "Pallars Jussà quiere decir «el Pallars de abajo». El de arriba es el Pallars Sobirà. Antes eran un único condado que acabó partido en dos."
  ],
  nature:[
    "A media mañana, cuando el sol calienta la roca, el aire caliente sube en columnas invisibles llamadas térmicas. Los <strong>buitres leonados</strong> se montan en ellas y ganan altura en espiral sin mover un ala. Pueden medir hasta 2,8 m de punta a punta, más que una puerta tumbada.",
    "Si ves un pájaro enorme con la cola en forma de rombo, para y mira bien: puede ser un <strong>quebrantahuesos</strong>. Come casi solo huesos. Los que no le caben, los sube volando y los deja caer sobre las rocas para partirlos, y tiene muy buena puntería.",
    "Roza los matorrales con la mano: <strong>romero</strong>, <strong>tomillo</strong>, <strong>aliaga</strong>. Esta ladera huele a cocina."
  ]
},
{ id:5, type:"village", at:[42.10354,0.86338], km:3609, alt:785,
  name:"Collmorter", sub:"El collado de los muertos (tranquilo, solo es el nombre)",
  lead:"Un puñado de casas sobre un collado, justo a medio camino entre los dos castillos. Tranquilo, con vistas, y con un nombre que da un poco de repelús.",
  body:[
    "Según el gran filólogo Joan Coromines, Collmorter viene del latín medieval <em>collem mortuorium</em>: la colina mortuoria. Parece que aquí estuvo el primer cementerio de Mur, en el lugar que todavía hoy se llama Tros de Gassó. Tenía su lógica: cerca del castillo, pero no dentro.",
    "Collmorter nunca fue una metrópolis. Madoz contó cuatro casas habitadas a mediados del siglo XIX, hacia 1900 llegó a 43 vecinos y en 1960 el censo dio 25. Hoy tiene 7 empadronados y unas cuantas casas de fin de semana.",
    "La capilla de Casa Francisco pudo ser la iglesia original del lugar, dedicada a Sant Miquel. Un arcángel con espada vigilando la colina de los muertos: no está mal elegido."

/* ---------- geometry ---------- */
const [la0,la1,lo0,lo1] = D.dem.bbox;
const kx = Math.cos((la0+la1)/2*Math.PI/180);
const S = 20000;
const W = (lo1-lo0)*kx*S, H = (la1-la0)*S;
const P = ([la,lo]) => [(lo-lo0)*kx*S, (la1-la)*S];
const metersPerUnit = 111320/S;
const track = D.track.map(P);
const cum = D.cum;
const total = cum[cum.length-1];
function posAt(m){
  let i = d3.bisectRight(cum, m) - 1; i = Math.max(0, Math.min(i, cum.length-2));
  const f = (m-cum[i])/((cum[i+1]-cum[i])||1);
  const a = track[i], b = track[i+1];
  return [a[0]+f*(b[0]-a[0]), a[1]+f*(b[1]-a[1]), Math.atan2(b[1]-a[1], b[0]-a[0])];
}
const fmtKm = m => (m/1000).toFixed(1).replace('.', ',');

// hillshade
(function(){
  const {nx,ny,z} = D.dem;
  const cv = document.createElement('canvas'); cv.width = nx; cv.height = ny;
  const ctx = cv.getContext('2d'); const img = ctx.createImageData(nx, ny);
  const cx = (lo1-lo0)/(nx-1)*111320*kx, cy = (la1-la0)/(ny-1)*110540;
  const az = 315*Math.PI/180, zen = 45*Math.PI/180;
  const Z = (i,j) => z[Math.max(0,Math.min(ny-1,j))*nx + Math.max(0,Math.min(nx-1,i))];
  for (let j=0;j<ny;j++) for (let i=0;i<nx;i++){
    const dzdx = (Z(i+1,j)-Z(i-1,j))/(2*cx), dzdy = (Z(i,j+1)-Z(i,j-1))/(2*cy);
    const slope = Math.atan(1.4*Math.hypot(dzdx,dzdy));
    const aspect = Math.atan2(dzdy, -dzdx);
    let sh = Math.cos(zen)*Math.cos(slope) + Math.sin(zen)*Math.sin(slope)*Math.cos(az - Math.PI/2 - aspect);
    const a = Math.max(0, Math.min(1, (0.78 - sh)*1.5));
    const k = (j*nx+i)*4; img.data[k]=12; img.data[k+1]=20; img.data[k+2]=14; img.data[k+3]=Math.round(a*190);
  }
  ctx.putImageData(img,0,0);
  root.append('image').attr('class','hill').attr('href', cv.toDataURL()).attr('x',0).attr('y',0)
    .attr('width',W).attr('height',H).attr('preserveAspectRatio','none');
})();

let T = d3.zoomIdentity, fitK = 1, sel = 0;
function draw(){
  root.attr('transform', T);
  const ap = p => T.apply(p);
  gArrows.selectAll('path').attr('transform', d => { const [x,y] = ap(d); return `translate(${x},${y}) rotate(${d[2]*180/Math.PI})`; });
  kmG.attr('transform', d => `translate(${ap(d.p)})`);
  gPlaces.selectAll('text').attr('transform', d => { const [x,y]=ap(P(d.at)); return `translate(${x+d.dx},${y})`; });
  poiG.attr('transform', d => `translate(${ap(P(d.at))})`);
  poiG.select('.lab').attr('display', T.k > fitK*1.9 ? null : 'none');
  if (me){
    const [x,y] = ap(me.p);
    meG.attr('display',null).attr('transform',`translate(${x},${y})`);
    meAcc.attr('r', Math.max(8, me.acc/metersPerUnit*T.k));
  }
  if (cursorM != null){ const [x,y] = ap(posAt(cursorM)); cursor.attr('cx',x).attr('cy',y); }
  // scale bar
  const pxPerM = T.k/metersPerUnit; const opts=[100,200,250,500,1000,2000];
  const m = opts.find(v => v*pxPerM >= 55) || 2000;
  document.getElementById('scaleline').style.width = (m*pxPerM)+'px';
  document.getElementById('scaletxt').textContent = m>=1000 ? (m/1000)+' km' : m+' m';
}
const zoom = d3.zoom().on('zoom', e => { T = e.transform; draw(); });
svg.call(zoom).on('dblclick.zoom', null);

function fitTransform(){
  const r = svg.node().getBoundingClientRect();
  const xs = track.map(p=>p[0]).concat([mir[0]]), ys = track.map(p=>p[1]).concat([mir[1]]);
  const [x0,x1] = d3.extent(xs), [y0,y1] = d3.extent(ys);
  const pad = 36, k = Math.min((r.width-2*pad)/(x1-x0), (r.height-2*pad-40)/(y1-y0));
  fitK = k;
  zoom.scaleExtent([k*0.7, k*9]).translateExtent([[-W*0.1,-H*0.1],[W*1.1,H*1.1]]);
  return d3.zoomIdentity.translate(r.width/2, r.height/2 - 14).scale(k).translate(-(x0+x1)/2, -(y0+y1)/2);
}
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function go(t){ (reduced ? svg : svg.transition().duration(750)).call(zoom.transform, t); }
function flyTo(p){
  const r = svg.node().getBoundingClientRect();
  const k = Math.max(T.k, fitK*2.2);
  go(d3.zoomIdentity.translate(r.width/2, r.height/2).scale(k).translate(-p[0], -p[1]));
}

document.getElementById('zout').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1/1.6);
document.getElementById('zfit').onclick = () => go(fitTransform());

const prof = d3.select('#prof');
let cursorM = null, px, py;
function drawProfile(){
  const r = prof.node().getBoundingClientRect(); const w = r.width, h = r.height;
  prof.attr('viewBox', `0 0 ${w} ${h}`).selectAll('*').remove();
  const m = {l:34, r:8, t:18, b:18};
  px = d3.scaleLinear([0,total],[m.l, w-m.r]);
  py = d3.scaleLinear([480, 920],[h-m.b, m.t]);
  [500,600,700,800,900].forEach(v => {
    prof.append('line').attr('class','p-grid').attr('x1',m.l).attr('x2',w-m.r).attr('y1',py(v)).attr('y2',py(v));
    prof.append('text').attr('class','p-tick').attr('x',m.l-5).attr('y',py(v)+3).attr('text-anchor','end').text(v);
  });
  d3.range(0, total, 1000).concat([]).forEach(v => prof.append('text').attr('class','p-tick').attr('x',px(v)).attr('y',h-4).attr('text-anchor','middle').text(v/1000 + (v===0?' km':'')));
  const area = d3.area().x(d=>px(d[0])).y0(py(480)).y1(d=>py(d[1])).curve(d3.curveMonotoneX);
  prof.append('path').attr('class','p-area').attr('d', area(D.prof));
  prof.append('path').attr('class','p-line').attr('d', area.lineY1()(D.prof));
  const cur = prof.append('line').attr('class','p-cur').attr('y1',m.t-6).attr('y2',h-m.b).attr('display','none');
  const pp = prof.append('g').selectAll('g').data(POIS.filter(d=>d.km!=null && d.km>0)).join('g').attr('class','p-poi')
    .attr('transform', d => `translate(${px(d.km)},0)`)
    .on('click', (e,d) => { e.stopPropagation(); select(d.id, true); });
  pp.append('line').attr('y1', 16).attr('y2', d => py(elevAt(d.km)));
  pp.append('circle').attr('cy',8).attr('r',7.5).attr('fill', d => TYPES[d.type].color);
  pp.append('text').attr('y',8).text(d=>d.id);
  const ro = document.getElementById('readout');
  prof.on('pointermove', e => {
    const [x] = d3.pointer(e); const mm = Math.max(0, Math.min(total, px.invert(x)));
    cursorM = mm; cur.attr('display',null).attr('x1',px(mm)).attr('x2',px(mm));
    cursor.attr('display',null); draw();
    ro.textContent = `km ${fmtKm(mm)} · ${elevAt(mm)} m`;
  }).on('pointerleave', () => {
    cursorM = null; cur.attr('display','none'); cursor.attr('display','none');
    ro.textContent = meText() || 'Pasa el dedo por el perfil';
  });
  if (me && me.off < 250) prof.append('circle').attr('class','p-me').attr('r',6).attr('cx',px(me.m)).attr('cy',py(elevAt(me.m)));
}
function elevAt(m){ const i = Math.min(D.prof.length-1, Math.round(m/25)); return D.prof[i][1]; }

/* ---------- story panel ---------- */
const story = document.getElementById('story');
function chip(d){ return `<span class="chip"><i style="background:${TYPES[d.type].color}"></i>${TYPES[d.type].label}</span>`; }
function renderIntro(){
  story.innerHTML = `
    <div class="kick">Cuaderno de ruta</div>
    <h2>Dos castillos, un collado de los muertos y un ábside en Boston</h2>
    <p class="lead">Ocho kilómetros, dos castillos de hace mil años y una pregunta: ¿qué hace la pared de una iglesia del Pallars colgada en un museo de Estados Unidos?</p>
    <p>Saldremos de la plaza de un pueblo que un día decidió bajar de la montaña. Subiremos a una torre con forma de proa que vigilaba la frontera con al-Ándalus, cruzaremos un collado con nombre de cementerio y llegaremos a Mur, donde unos suegros acabaron haciendo de banco de su propio yerno. Por el camino hay dinosaurios, buitres de casi tres metros y un pájaro que planta bosques sin querer.</p>
    <p>Toca cualquier número del mapa o del perfil y te cuento la historia de ese sitio.</p>
    <button class="btn-start" id="startbtn">Empezar por la plaza</button>
    <h3>Paradas</h3>
    <ul class="stops">${POIS.map(d => `
      <li><button data-id="${d.id}"><span class="n" style="background:${TYPES[d.type].color}">${d.id}</span>
      <span class="t">${d.name}<small>${d.sub}</small></span>
      <span class="k">${d.km==null ? 'ruta larga' : 'km '+fmtKm(d.km)}${d.alt? '<br>'+d.alt+' m':''}</span></button></li>`).join('')}
    </ul>
    <p class="note">El trazado del mapa es aproximado: lo he calculado sobre los caminos de OpenStreetMap entre los puntos que menciona la organización y sale de unos 10 km. El oficial anuncia unos 8 km y +400 m. El día de la marcha sigue siempre la señalización. Los avituallamientos no están marcados porque la organización no ha publicado dónde estarán.</p>`;
  story.querySelectorAll('.stops button').forEach(b => b.onclick = () => select(+b.dataset.id, true));
  story.querySelector('#startbtn').onclick = () => select(1, true);
}
function renderPoi(d){
  const i = POIS.indexOf(d), prev = POIS[i-1], next = POIS[i+1];
  const kmtxt = d.km==null ? 'fuera de la ruta corta' : `km ${fmtKm(d.km)}`;
  story.innerHTML = `
    <div class="kick">${chip(d)}<span class="num">Parada ${d.id} · ${kmtxt}${d.alt ? ' · '+d.alt+' m' : ''}</span></div>
    <h2>${d.name}</h2>
    <p class="sub">${d.sub}</p>
    <p class="lead">${d.lead}</p>
    ${d.body.map(p => `<p>${p}</p>`).join('')}
    ${d.tell ? `<div class="tell"><span>Para contar al grupo</span><p>${d.tell}</p></div>` : ''}
    ${d.facts.length ? `<h3>Datos curiosos</h3><ul class="facts">${d.facts.map(f=>`<li>${f}</li>`).join('')}</ul>` : ''}
    ${d.nature ? `<div class="nature"><h3>Mira a tu alrededor</h3>${d.nature.map(p=>`<p>${p}</p>`).join('')}</div>` : ''}
    <div class="osm"><a href="https://www.openstreetmap.org/?mlat=${d.at[0]}&mlon=${d.at[1]}#map=17/${d.at[0]}/${d.at[1]}" target="_blank" rel="noopener">Ver en OpenStreetMap</a> · <a href="#" id="backintro">Todas las paradas</a></div>
    <div class="nav">
      <button id="prevb" ${prev?'':'disabled'}><small>Anterior</small><span>${prev? prev.id+'. '+prev.name : ''}</span></button>
      <button id="nextb" ${next?'':'disabled'}><small>Siguiente</small><span>${next? next.id+'. '+next.name : ''}</span></button>
    </div>`;
  if (prev) story.querySelector('#prevb').onclick = () => select(prev.id, true);
  if (next) story.querySelector('#nextb').onclick = () => select(next.id, true);
  story.querySelector('#backintro').onclick = e => { e.preventDefault(); select(0, true); };
}
const mobile = () => window.matchMedia('(max-width:860px)').matches;
function select(id, user){
  sel = id;
  poiG.classed('on', d => d.id === id);
  const d = POIS.find(p => p.id === id);
  const aside = document.getElementById('panel');
  if (!d){ renderIntro(); routeHi.attr('d',''); if (user) go(fitTransform()); }
  else {
    renderPoi(d);
    if (d.km != null){
      const a = Math.max(0, d.km-400), b = Math.min(total, d.km+400);
      routeHi.attr('d', line(d3.range(a, b, 20).map(m => posAt(m))));
    } else routeHi.attr('d','');
    if (user) flyTo(P(d.at));
  }
  aside.scrollTop = 0;
  if (user && mobile()) aside.scrollIntoView({behavior: reduced ? 'auto':'smooth', block:'start'});
  try { history.replaceState(null, '', id ? '#parada-'+id : '#'); } catch(e){}
}

/* ---------- mi ubicación (GPS) ---------- */
function snap(q){
  // punto más cercano del track: devuelve metros recorridos y distancia a la ruta (en metros)
  let best = {d:Infinity, m:0};
  for (let i=0;i<track.length-1;i++){
    const a = track[i], b = track[i+1], vx = b[0]-a[0], vy = b[1]-a[1];
    const L = vx*vx+vy*vy, f = L ? Math.max(0, Math.min(1, ((q[0]-a[0])*vx+(q[1]-a[1])*vy)/L)) : 0;
    const d = Math.hypot(a[0]+f*vx-q[0], a[1]+f*vy-q[1]);
    if (d < best.d) best = {d, m: cum[i] + f*(cum[i+1]-cum[i])};
  }
  return {m: best.m, off: best.d*metersPerUnit};
}
function meText(){
  if (!me) return '';
  if (me.out) return 'Estás fuera de la zona del mapa';
  if (me.off > 250) return `A ${Math.round(me.off/10)*10} m de la ruta`;
  return `Tú: km ${fmtKm(me.m)} · ${elevAt(me.m)} m · faltan ${fmtKm(Math.max(0,total-me.m))} km`;
}
const meBtn = document.getElementById('zme'), meSt = document.getElementById('mestatus');
let meWatch = null, meCenter = false, meStaleT = null;
function meStatus(t){ meSt.hidden = !t; meSt.textContent = t; }
function onPos(pos){
  const {latitude:la, longitude:lo, accuracy} = pos.coords;
  const p = P([la,lo]);
  const out = la<la0 || la>la1 || lo<lo0 || lo>lo1;
  me = Object.assign({p, acc: accuracy||0, out}, snap(p));
  meBtn.classList.remove('wait'); meBtn.classList.add('on');
  meG.classed('me-stale', false);
  clearTimeout(meStaleT); meStaleT = setTimeout(() => meG.classed('me-stale', true), 60000);
  meStatus(meText() + (accuracy > 50 ? ` (±${Math.round(accuracy)} m)` : ''));
  if (cursorM == null) document.getElementById('readout').textContent = meText();
  drawProfile();
  if (meCenter && !out){ meCenter = false; flyTo(p); } else draw();
}
function onPosErr(err){
  meBtn.classList.remove('wait');
  const msg = err.code === 1 ? 'Permiso de ubicación denegado. Actívalo en los ajustes del navegador para esta web.'
    : err.code === 3 ? 'Buscando señal GPS…' : 'No se puede obtener la ubicación ahora mismo.';
  meStatus(msg);
  if (err.code === 1 && meWatch != null){ navigator.geolocation.clearWatch(meWatch); meWatch = null; meBtn.classList.remove('on'); }
}
meBtn.onclick = () => {
  if (!('geolocation' in navigator)){ meStatus('Este navegador no da la ubicación.'); return; }
  if (!window.isSecureContext){ meStatus('La ubicación solo funciona si abres el mapa desde una dirección https.'); return; }
  if (me && meWatch != null && !me.out){ flyTo(me.p); return; }
  meCenter = true;
  if (meWatch == null){
    meBtn.classList.add('wait'); meStatus('Buscando tu posición…');
    meWatch = navigator.geolocation.watchPosition(onPos, onPosErr, {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
  }
};

/* ---------- boot ---------- */
function layout(){ T = fitTransform(); svg.call(zoom.transform, T); drawProfile(); }
window.addEventListener('resize', () => { drawProfile(); draw(); });
layout();
const h = (location.hash.match(/parada-(\d+)/)||[])[1];
select(h ? +h : 0, false);
if (h) { const d = POIS.find(p=>p.id===+h); if (d) flyTo(P(d.at)); }
</script>
